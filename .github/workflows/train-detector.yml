name: Train detector

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: Training epochs
        default: "12"
        required: true
      samples_per_piece:
        description: Synthetic samples per artwork
        default: "160"
        required: true
      publish:
        description: Publish the model to the app when done
        type: boolean
        default: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      COLLECTIVE_URL: ${{ secrets.COLLECTIVE_URL }}
      COLLECTIVE_TOKEN: ${{ secrets.COLLECTIVE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/pyproject.toml

      - name: Install collective-ml (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ./ml

      - name: Train and export
        run: |
          collective-ml run \
            --workspace ml/workspace \
            --epochs "${{ inputs.epochs }}" \
            --samples-per-piece "${{ inputs.samples_per_piece }}" \
            --workers 2 \
            ${{ inputs.publish && '' || '--no-publish' }}

      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detector-model
          path: |
            ml/workspace/*/model/model.onnx
            ml/workspace/*/model/labels.json
            ml/workspace/*/model/metrics.json
          retention-days: 30
