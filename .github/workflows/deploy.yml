name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ml/**'
      - 'data/**'
      - '.github/workflows/train-detector.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, type-check, test
        working-directory: apps/web
        run: |
          npm run lint
          npm run check
          npm run test -- --project server

      - name: Build
        working-directory: apps/web
        run: npm run build

      - name: Apply D1 migrations
        working-directory: apps/web
        run: npx wrangler d1 migrations apply collective --remote

      - name: Deploy Worker
        working-directory: apps/web
        run: npx wrangler deploy
