name: Deploy Worker & Infra

on:
  push:
    branches: [ main ]
    paths:
      - "workers/**"
      - "infra/**"
      - ".github/workflows/deploy-worker.yml"

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra
        env:
          TF_VAR_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          terraform init -input=false

      - name: Lookup existing KV namespace
        id: kv_lookup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TMP=$(mktemp)
          curl -sS -X GET \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=100" \
            -o "$TMP"
          existing=$(jq -r '.result[] | select(.title == "gg-reactions") | .id' "$TMP" | head -n 1)
          if [ -n "$existing" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "namespace_id=$existing" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Import existing namespace
        if: steps.kv_lookup.outputs.found == 'true'
        working-directory: infra
        env:
          TF_VAR_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          terraform import cloudflare_workers_kv_namespace.reactions ${{ secrets.CF_ACCOUNT_ID }}/${{ steps.kv_lookup.outputs.namespace_id }}

      - name: Terraform Apply
        working-directory: infra
        env:
          TF_VAR_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          terraform apply -auto-approve -input=false
          terraform output -json > tf-outputs.json

      - name: Export TF outputs
        id: tf
        working-directory: infra
        run: |
          echo "KV_NAMESPACE_ID=$(jq -r '.kv_namespace_id.value' tf-outputs.json)" >> $GITHUB_OUTPUT

      - name: Upload TF outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf-outputs
          path: infra/tf-outputs.json

  deploy_worker:
    runs-on: ubuntu-latest
    needs: infra
    steps:
      - uses: actions/checkout@v4

      - name: Get TF outputs
        uses: actions/download-artifact@v4
        with:
          name: tf-outputs
          path: /tmp
        continue-on-error: true

      - name: Read TF outputs (fallback)
        id: tf
        run: |
          if [ -f infra/tf-outputs.json ]; then SRC=infra/tf-outputs.json; else SRC=/tmp/tf-outputs.json; fi
          echo "KV_NAMESPACE_ID=$(jq -r '.kv_namespace_id.value' $SRC)" >> $GITHUB_OUTPUT

      - name: Ensure workers.dev subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WORKERS_SUBDOMAIN: plattegruber
        run: |
          set -euo pipefail
          TMP=$(mktemp)
          curl -sS -X GET \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -o "$TMP"
          existing=$(jq -r '.result.subdomain // ""' "$TMP")
          if [ "$existing" = "$WORKERS_SUBDOMAIN" ]; then
            echo "Subdomain already configured as $existing"
            exit 0
          fi
          payload=$(jq -n --arg sub "$WORKERS_SUBDOMAIN" '{subdomain: $sub}')
          status=$(curl -sS -o "$TMP" -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "Subdomain set to $WORKERS_SUBDOMAIN"
            exit 0
          fi
          errors=$(jq -r '.errors[]?.message // empty' "$TMP")
          if echo "$errors" | grep -qi 'already'; then
            echo "Subdomain already registered: $errors"
            exit 0
          fi
          echo "Failed to configure subdomain (status $status): $errors" >&2
          exit 1

      - name: Inject IDs into wrangler.toml
        working-directory: workers
        run: |
          sed -i "s|\${KV_NAMESPACE_ID}|${{ steps.tf.outputs.KV_NAMESPACE_ID }}|g" wrangler.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps & Build
        run: |
          npm ci
          npm run build

      - name: Publish Worker
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
