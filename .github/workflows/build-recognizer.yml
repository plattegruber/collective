name: Build recognizer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (default: today's date)
        default: ""
        required: false
      epochs:
        description: Detector training epochs
        default: "16"
        required: true
      publish:
        description: Publish the release to the app when done
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      COLLECTIVE_URL: ${{ secrets.COLLECTIVE_URL }}
      COLLECTIVE_RELEASE_TOKEN: ${{ secrets.COLLECTIVE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/pyproject.toml

      - name: Install collective-ml (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e './ml[train]'

      - name: Build the release
        run: |
          collective-ml run \
            --workspace ml/workspace \
            --epochs "${{ inputs.epochs }}" \
            --workers 2 \
            ${{ inputs.version != '' && format('--release-version "{0}"', inputs.version) || '' }} \
            ${{ inputs.publish && '--publish' || '' }}

      - name: Upload the release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recognizer-release
          path: |
            ml/workspace/release/
            ml/workspace/detector/metrics.json
            ml/workspace/eval/report.json
          retention-days: 30
