name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint, type-check, unit tests, build
        working-directory: apps/web
        run: |
          npm run lint
          npm run check
          npm run test -- --project server
          npm run build
